---
# Black Relay "Multithread" hub on BR2026. Sites reach it over HTTPS 443
# through Caddy (no published ports, no public UDP).
black_relay_hub_image: "black-relay:0.3.5-mt3"
black_relay_hub_image_tar: "black-relay-image_0.3.5-mt3_amd64.tar.gz"
black_relay_hub_image_sha256: "7e6ba5ef625d8cf6f40490262bfd4981daeb40261ced01351a79ce2352d2e307"
# What `docker image inspect` reports as .Id for that build: the config digest
# (classic image store) or the manifest digest (containerd image store). The
# role fails if the image under the tag is anything else; an empty list skips
# the check.
black_relay_hub_image_ids:
  - "sha256:3712e7238ec32ffaf17d8c4164d0698c112913508b067ef5cb803cd668dcbe1b"
  - "sha256:a706e0d7a68d8826aea74c42d03c9bcac280840e7dbdc6809732649b6c77328e"
black_relay_hub_dir: /srv/black-relay
# Fixed tunnel binary bind-mounted over the image's own until the next image
# build carries it (0.3.4+br7: hourly key rotation no longer wedges the hub).
# Static x86_64 build from multipath/packaging/build.sh; placed in files/ like
# the image archive (not in git). Empty = use the image's binary.
black_relay_hub_glorytun_bin: "glorytun-0.3.4+br7-x86_64"
black_relay_hub_glorytun_sha256: "4425808e3916d4781d68d7d782be7d96edfe58cc07d67ab3f651fc298d887b32"
black_relay_hub_container: survivability-black-relay
black_relay_hub_public_ip: "{{ ansible_default_ipv4.address }}"
black_relay_hub_port_base: 5000
# Fixed address on edge_proxy_network (the edge role's identity_proxy network).
black_relay_hub_proxy_address: "172.29.0.10"
# Secret upgrade-path prefix "multithread-<32 hex>": secrets.sops.yml only.
# black_relay_hub_ws_prefix:

# Site services Caddy may reach at multithread:<hub_port>, through the site's
# tunnel (br-supervise publish). The edge Caddyfile routes /cwwk/* on the
# Headscale host to the CWWK controller, which requires a Pocket ID sign-in.
black_relay_hub_publish:
  - hub_port: 8444
    site_ip: "10.40.0.10"
    site_port: 8444
