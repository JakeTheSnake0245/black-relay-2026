---
# sf-dev: the Sensor Fusion box. A Sysbox system container (systemd + its own
# Docker inside, own user namespace), reached only over the tailnet. Its whole
# system, Docker data, /home and tailnet identity live on its own disk, so
# restarts, recreates and image rebuilds keep everything.

- name: Require the tags sf-dev joins with to be declared in the policy
  ansible.builtin.assert:
    that:
      - sf_dev_tag_owner_line in lookup('ansible.builtin.file', sf_dev_policy_file)
    fail_msg: "{{ item }} must be in tagOwners of headscale-policy.hujson before sf-dev can join."
    quiet: true
  loop: "{{ sf_dev_tags }}"
  vars:
    sf_dev_policy_file: "{{ role_path }}/../identity_stack/files/headscale-policy.hujson"
    sf_dev_tag_owner_line: '"{{ item }}": ["group:survivability"]'

# ---------------------------------------------------------------- Sysbox
# Docker must already know the network settings Sysbox wants, or its installer
# restarts Docker (every service on this host). bip keeps today's docker0.
- name: Docker settings Sysbox needs (no Docker restart)
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PY'
    import json, os
    p = "/etc/docker/daemon.json"
    c = json.load(open(p))
    before = json.dumps(c, sort_keys=True)
    c.setdefault("bip", "{{ sf_dev_docker_bip }}")
    if not c.get("default-address-pools"):
        c["default-address-pools"] = [{"base": "{{ sf_dev_docker_pool }}", "size": 24}]
    c.setdefault("runtimes", {}).setdefault("sysbox-runc", {"path": "/usr/bin/sysbox-runc"})
    if json.dumps(c, sort_keys=True) != before:
        tmp = p + ".tmp"
        with open(tmp, "w") as f:
            json.dump(c, f, indent=2)
        os.replace(tmp, p)
        print("changed")
    PY
  args:
    executable: /bin/bash
  register: sf_dev_daemon_json
  changed_when: "'changed' in sf_dev_daemon_json.stdout"

- name: Sysbox package
  ansible.builtin.get_url:
    url: "{{ sf_dev_sysbox_url }}"
    dest: "/root/sysbox-ce_{{ sf_dev_sysbox_version }}.deb"
    checksum: "sha256:{{ sf_dev_sysbox_sha256 }}"
    mode: "0600"

- name: Install Sysbox
  ansible.builtin.apt:
    deb: "/root/sysbox-ce_{{ sf_dev_sysbox_version }}.deb"

# Runtimes are a reloadable Docker setting: SIGHUP, never a restart.
- name: Make Docker load the Sysbox runtime
  ansible.builtin.shell: |
    set -euo pipefail
    if ! docker info --format '{{ '{{' }}json .Runtimes{{ '}}' }}' | grep -q sysbox-runc; then
      kill -HUP "$(pidof dockerd)"; sleep 2
      echo reloaded
    fi
    docker info --format '{{ '{{' }}json .Runtimes{{ '}}' }}' | grep -q sysbox-runc
  args:
    executable: /bin/bash
  register: sf_dev_runtime
  changed_when: "'reloaded' in sf_dev_runtime.stdout"

- name: Sysbox running
  ansible.builtin.systemd_service:
    name: sysbox
    enabled: true
    state: started

# ---------------------------------------------------------------- disk
- name: Create the sf-dev directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ sf_dev_dir }}", mode: "0700"}
    - {path: "{{ sf_dev_dir }}/build", mode: "0700"}
    - {path: "{{ sf_dev_dir }}/disk", mode: "0755"}

- name: Disk image
  ansible.builtin.shell: >-
    fallocate -l {{ sf_dev_disk_size }} {{ sf_dev_dir }}/disk.img &&
    mkfs.ext4 -q -L sf-dev {{ sf_dev_dir }}/disk.img
  args:
    creates: "{{ sf_dev_dir }}/disk.img"

# Mounted before Docker starts, so the container never writes into the empty
# mount point on the root disk.
- name: Disk mounted (and at boot)
  ansible.posix.mount:
    path: "{{ sf_dev_dir }}/disk"
    src: "{{ sf_dev_dir }}/disk.img"
    fstype: ext4
    opts: loop,nofail,x-systemd.before=docker.service
    dump: "0"
    passno: "2"
    state: mounted

# Grows only, online (ext4 under its loop device). Never shrinks.
- name: Grow the disk to its size
  ansible.builtin.shell: |
    set -euo pipefail
    img={{ sf_dev_dir }}/disk.img
    want=$(numfmt --from=iec {{ sf_dev_disk_size }})
    have=$(stat -c %s "$img")
    if [ "$have" -lt "$want" ]; then
      fallocate -l {{ sf_dev_disk_size }} "$img"
      dev=$(losetup -j "$img" | cut -d: -f1 | head -n1)
      losetup -c "$dev"
      resize2fs -f "$dev" >/dev/null
      echo grown
    fi
  args:
    executable: /bin/bash
  register: sf_dev_grow
  changed_when: "'grown' in sf_dev_grow.stdout"

- name: Home, Docker data and tailnet identity on the disk
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ sf_dev_dir }}/disk/home", mode: "0755"}
    - {path: "{{ sf_dev_dir }}/disk/docker", mode: "0710"}
    - {path: "{{ sf_dev_dir }}/disk/tailscale", mode: "0700"}

# ---------------------------------------------------------------- image + system
- name: Image build context
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ sf_dev_dir }}/build/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ sf_dev_box_files + [{'src': 'Dockerfile.j2', 'dest': 'Dockerfile'}] }}"
  register: sf_dev_build_context

- name: Check whether the sf-dev image exists
  ansible.builtin.command: docker image inspect {{ sf_dev_image }}
  register: sf_dev_image_check
  changed_when: false
  failed_when: false

- name: Build the sf-dev image
  ansible.builtin.command: docker build -q -t {{ sf_dev_image }} {{ sf_dev_dir }}/build
  when: sf_dev_image_check.rc != 0 or sf_dev_build_context is changed
  changed_when: true

- name: Read the system generation on the disk
  ansible.builtin.slurp:
    src: "{{ sf_dev_dir }}/disk/system/.seeded"
  register: sf_dev_seeded
  failed_when: false

# Only when the generation goes up (first time, or a deliberate re-seed): the
# old container goes, the old system is kept aside, the new one is copied out
# of the image. /home, Docker data and the tailnet identity are separate and
# stay.
- name: Seed the system from the image
  when: >-
    (sf_dev_seeded.content | default('') | b64decode | trim or '0') | int
    < sf_dev_system_generation
  ansible.builtin.shell: |
    set -euo pipefail
    S={{ sf_dev_dir }}/disk/system
    docker rm -f {{ sf_dev_container }} >/dev/null 2>&1 || true
    [ -d "$S" ] && mv "$S" "{{ sf_dev_dir }}/disk/system.before-$(date +%Y%m%d-%H%M%S)"
    T=$(mktemp -d {{ sf_dev_dir }}/disk/.seed.XXXXXX)
    cid=$(docker create {{ sf_dev_image }})
    docker export "$cid" | tar -x --numeric-owner -p -C "$T"
    docker rm "$cid" >/dev/null
    mkdir -p "$S"
    for d in {{ sf_dev_system_dirs | join(' ') }}; do mv "$T/$d" "$S/$d"; done
    rm -rf "$T"
    echo {{ sf_dev_system_generation }} > "$S/.seeded"
  args:
    executable: /bin/bash
  changed_when: true

# The box's own units and guide are kept current in the persisted system too,
# so a change here reaches a running box (picked up at its next start).
- name: The box's own units and guide
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ sf_dev_dir }}/disk/system/{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop: "{{ sf_dev_box_files }}"
  register: sf_dev_box_units

- name: Egress guard unit
  ansible.builtin.template:
    src: sf-dev-guard.service.j2
    dest: /etc/systemd/system/sf-dev-guard.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart sf-dev guard

- name: Egress guard enabled
  ansible.builtin.systemd_service:
    name: sf-dev-guard.service
    enabled: true
    state: started
    daemon_reload: true

- name: Create the sf-dev network
  community.docker.docker_network:
    name: "{{ sf_dev_network }}"
    driver: bridge
    ipam_config:
      - subnet: "{{ sf_dev_subnet }}"

- name: Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ sf_dev_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Join key folder in the box
  ansible.builtin.file:
    path: "{{ sf_dev_dir }}/disk/system/etc/sf-dev"
    state: directory
    owner: root
    group: root
    mode: "0700"

# ---------------------------------------------------------------- tailnet join
- name: Check for an existing tailnet identity
  ansible.builtin.stat:
    path: "{{ sf_dev_dir }}/disk/tailscale/tailscaled.state"
  register: sf_dev_state

# Only when the node has never joined: a single-use, one-hour key carrying the
# sf-dev tags, written into the box's /etc/sf-dev and emptied after the join.
- name: Issue a one-time join key
  when: not sf_dev_state.stat.exists
  block:
    - name: Create the join key
      ansible.builtin.command: >-
        docker exec {{ sf_dev_headscale_container }} headscale preauthkeys create
        --tags {{ sf_dev_tags | join(',') }} --expiration 1h
      register: sf_dev_key
      changed_when: true
      no_log: true

    - name: Hand the join key to the box
      ansible.builtin.copy:
        content: "{{ sf_dev_key.stdout_lines | last | trim }}"
        dest: "{{ sf_dev_dir }}/disk/system/etc/sf-dev/ts-authkey"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      diff: false

- name: Start sf-dev
  ansible.builtin.command: >-
    docker compose -f {{ sf_dev_dir }}/compose.yml up -d
    {{ '--force-recreate' if sf_dev_box_units is changed else '' }}
  register: sf_dev_up
  changed_when: "'Started' in sf_dev_up.stderr or 'Recreated' in sf_dev_up.stderr"

- name: Wait for sf-dev on the tailnet
  ansible.builtin.command: docker exec {{ sf_dev_container }} tailscale ip -4
  register: sf_dev_ip
  until: sf_dev_ip.rc == 0 and sf_dev_ip.stdout | length > 0
  retries: 60
  delay: 3
  changed_when: false

- name: Empty the join key
  ansible.builtin.copy:
    content: ""
    dest: "{{ sf_dev_dir }}/disk/system/etc/sf-dev/ts-authkey"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
