# /etc/systemd/system/black-relay@br0.service.d/uplinks.conf
# Before every tunnel start: detect what is in each port and write UPLINKS
# (caps per device) and the modem-admin list. A moved cable changes a port's
# address, the watcher restarts the tunnel, and this runs again.
[Service]
ExecStartPre=/usr/local/sbin/br-uplinks apply
