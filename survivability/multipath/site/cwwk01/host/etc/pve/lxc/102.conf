cores: 1
hostname: br-router
memory: 256
net0: name=eth0,bridge=vmbr1,hwaddr=BC:24:11:1E:AB:76,type=veth
net1: name=eth1,bridge=vmbr2,hwaddr=BC:24:11:3D:1A:23,type=veth
net2: name=eth2,bridge=vmbr3,hwaddr=BC:24:11:70:7E:77,type=veth
