# Black Relay edge: the tunnel (per-uplink tables 7100+) and br-edge-routes
# (LAN fail-closed table 200) add their own rules and routes. By default
# networkd deletes such foreign rules/routes on reload, reconfigure or DHCP
# events, which loops the tunnel into itself and drops the LAN guard.
[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
