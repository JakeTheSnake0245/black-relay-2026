# written by black-relay-setup join (site cwwk01)
ROLE=client
DEV=br0
PORT=5001
KEYFILE=/etc/black-relay/br0.key
TUN_ADDR=10.255.1.2/30
SERVER=89.167.30.202
# IF:MBIT[:GATEWAY] or IF:auto, one per uplink
# TX/RX = upload/download Mbit. Shares follow these weights (scheduler random):
# evened 2026-11-07 so ISP and Starlink split downloads ~50/50 (Jake). Raw measured
# 2026-11-06: ISP 274 down/125 up, Starlink 183 down/~9 up.
# up0 = nic0 travel router (ISP)  274/125 raw
# up1 = nic1 Starlink             183/~9 raw; capped 6/100 (loss above that)
# up2 = nic2 Spitz, capped at normal 4G: 5 up / 20 down
UPLINKS="up0:100/150 up1:10/150 up2:100/150 up3:5/20"

# Multithread over HTTPS (2026-11-07): each uplink carries the tunnel inside
# its own WebSocket/TLS connection to BR2026 :443 (Caddy), so the hub needs no
# UDP port. Rollback to raw UDP: cp br0.conf.udp-bak br0.conf + restart.
TRANSPORT=wss
BIND=127.0.0.1
WSS_URL=wss://headscale.l8s.dev:443
WSS_PREFIX=<REDACTED>
# 3 HTTPS connections per uplink (loss stalls 1/3 of an uplink; faster window growth)
WSS_LANES=6
