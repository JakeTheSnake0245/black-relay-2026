# Site lock: the tailnet identity lives in the vault; tailscaled runs only when
# the box is unlocked (br-lockd starts and stops it).
[Unit]
RequiresMountsFor=/mnt/br-vault
ConditionPathIsMountPoint=/mnt/br-vault
[Service]
ExecStart=
ExecStart=/usr/sbin/tailscaled --state=/mnt/br-vault/tailscale/tailscaled.state --statedir=/mnt/br-vault/tailscale --socket=/run/tailscale/tailscaled.sock --port=${PORT} $FLAGS
