#Black Relay services host (cwwk01)%3A Docker for the Sensor Fusion services. Address 10.41.0.20. Use br-svc on the Proxmox host.
arch: amd64
cores: 4
features: nesting=1,keyctl=1
hostname: br-services
memory: 4096
nameserver: 10.41.0.1
net0: name=eth0,bridge=vmbr3,gw=10.41.0.1,hwaddr=BC:24:11:09:86:7D,ip=10.41.0.20/24,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-104-disk-0,size=60G
searchdomain: lan
startup: order=4
swap: 512
tags: br-gated
unprivileged: 1
