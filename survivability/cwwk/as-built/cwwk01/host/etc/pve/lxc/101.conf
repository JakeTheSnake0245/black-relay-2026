#Black Relay site edge%3A bonded tunnel to BR2026 hub, LAN router 10.40.0.1. up0=nic0 up1=nic1 up2=nic2 (any uplink, any port)
arch: amd64
cores: 2
dev0: /dev/net/tun
features: nesting=1
hostname: br-edge
memory: 1024
nameserver: 127.0.0.1
net1: name=up0,bridge=vmbr10,hwaddr=BC:24:11:1D:34:9F,ip=manual,tag=100,type=veth
net2: name=up1,bridge=vmbr10,hwaddr=BC:24:11:95:37:BB,ip=manual,tag=101,type=veth
net3: name=up2,bridge=vmbr10,hwaddr=BC:24:11:9C:50:8A,ip=manual,tag=102,type=veth
net4: name=tr0,bridge=vmbr2,hwaddr=BC:24:11:97:04:0E,ip=10.39.0.1/30,type=veth
net5: name=up3,bridge=vmbr10,hwaddr=BC:24:11:05:0D:44,ip=manual,tag=103,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-101-disk-0,size=8G
searchdomain: lan
startup: order=1
swap: 256
unprivileged: 1
