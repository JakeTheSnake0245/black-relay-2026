# What can be plugged into the CWWK's ports, how to recognise it, and its speed
# caps. br-uplinks reads this before every tunnel start; first match wins. Any
# port takes any modem. Edit freely; nothing about ports is fixed here.
#
#   kind      match                     caps (TX/RX Mbit)  label
#
# match: probe=<ip>:<port>  something answers there through this port (Starlink's
#                           dish always answers at 192.168.100.1:9200)
#        net=<cidr>         the address this port received (Starlink bypass: CGNAT)
#        gw=<ip>            the gateway the modem's DHCP hands out
#        any                everything else
# caps:  this end's upload/download share, as TX/RX. Downloads split by these
#        weights: ISP and Starlink even (Jake, 2026-11-07); Starlink's upload is
#        ~9 Mbit raw, so its upload stays small. Spitz held to normal 4G.
starlink  probe=192.168.100.1:9200  1000/1000   Starlink
spitz     gw=192.168.9.1            1000/1000     Spitz (cellular)
starlink  net=100.64.0.0/10         1000/1000   Starlink
isp       any                       1000/1000  ISP
